name: Web

on:
  push:
    branches: [main]
    paths: [web/**, tests/ImpactSE.Core.Tests/Fixtures/**, .github/workflows/web.yml]
  pull_request:
    paths: [web/**, tests/ImpactSE.Core.Tests/Fixtures/**, .github/workflows/web.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test the web page's mouse code
        run: node --test web/tests/*.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  # Publishes web/ to GitHub Pages. Needs Settings > Pages > Source set to "GitHub Actions".
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
