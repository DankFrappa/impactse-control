name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Test core library
        run: dotnet test tests/ImpactSE.Core.Tests -c Release

      # The WinUI resource (PRI) tasks ship with Visual Studio's MSBuild, not the .NET SDK.
      - uses: microsoft/setup-msbuild@v2

      - name: Publish app
        run: msbuild src/ImpactSE.App/ImpactSE.App.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=${{ github.workspace }}/publish/ImpactSE/

      - name: Check the download is a single exe that starts
        run: |
          $files = Get-ChildItem publish/ImpactSE -Recurse -File
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne "ImpactSE.exe") { throw "The download should hold only ImpactSE.exe" }
          $log = Join-Path $env:LOCALAPPDATA "ImpactSE\crash.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $app = Start-Process publish/ImpactSE/ImpactSE.exe -PassThru
          Start-Sleep -Seconds 20
          if (Test-Path $log) { Get-Content $log; throw "The app crashed on start" }
          if ($app.HasExited) { throw "The app closed on start (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force

      - uses: actions/upload-artifact@v5
        with:
          name: ImpactSE-win-x64
          path: publish/ImpactSE
          if-no-files-found: error

      # Replaces the "latest" release so https://github.com/<repo>/releases/latest/download/ImpactSE.exe
      # always serves the newest build from main, with no GitHub sign-in needed.
      - name: Publish the download link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          $notes = "Download **ImpactSE.exe** below, then double-click it. See the README for step-by-step help. Built from $env:GITHUB_SHA."
          gh release create latest publish/ImpactSE/ImpactSE.exe --target $env:GITHUB_SHA --title "Impact SE Control for Windows" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
